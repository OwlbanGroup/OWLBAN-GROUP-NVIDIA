[tool.poetry]
name = "jpmorgan-financial-apis"
version = "1.0.0"
description = "JPMorgan Financial APIs with performance optimizations"
authors = ["Your Team <team@example.com>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
mcp = "^1.0.0"
modelcontextprotocol = "^0.1.0"
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.0"
redis = "^5.0.0"
pydantic = "^2.9.0"
httpx = "^0.27.0"
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
mypy = "^1.15.0"
prometheus-client = "^0.21.0"
numpy = "^2.1.0"
torch = {version = "^2.5.0", optional = true}
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.0"
redis = "^5.0.0"
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
mypy = "^1.5.0"
flask-limiter = "^3.5.0"
prometheus-client = "^0.19.0"
numpy = "^1.24.0"

[tool.pytest.ini_options]
# addopts disabled - using pytest.ini
# addopts = "--cov-fail-under=95 --cov-report=term-missing --cov=jpmorgan_financial_apis"
pythonpath = ["."]
testpaths = ["tests", "jpmorgan_financial_apis/tests"]
markers = [
    "slow: marks tests as slow",
    "phase8: phase 8 integration tests", 
    "coverage: marks high-coverage tests"
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "flask.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "prometheus_client.*"
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
