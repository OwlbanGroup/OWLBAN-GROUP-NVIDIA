[project]
name = "jpmorgan-financial-apis"
version = "1.0.0"
description = "Enterprise-grade API for telemetry processing, ML anomaly detection, cloud integration, business asset management, and AI-powered financial insights"
authors = [
    {name = "JPMorgan Development Team", email = "dev@jpmorgan.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # Core async web framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",

    # Async database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",

    # Original Flask dependencies (keeping for compatibility during migration)
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "flask-limiter>=3.5.0",
    "flask-restx>=1.3.0",
    "flask-talisman>=1.1.0",

    # Data processing and ML
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",

    # External APIs and integrations
    "requests>=2.31.0",
    "httpx>=0.25.0",  # Async HTTP client
    "websockets>=12.0",

    # Database and caching
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",

    # Security and auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "python-multipart>=0.0.6",

    # Monitoring and metrics
    "prometheus-client>=0.19.0",

    # Rate limiting for FastAPI
    "slowapi>=0.1.9",

    # Configuration and utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Date and time handling
    "python-dateutil>=2.8.0",

    # Additional utilities
    "aiofiles>=23.2.1",
    "structlog>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
    "pylint>=3.0.0",
    "pre-commit>=3.5.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR:.."
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pylint.MASTER]
init-hook='import sys; sys.path.append(".")'

[tool.pylint.'MESSAGES CONTROL']
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
