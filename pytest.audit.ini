[pytest]
addopts = -q
pythonpath = .
testpaths = tests
filterwarnings =
    ignore::pytest.PytestConfigWarning
    ignore::pytest.PytestCollectionWarning
markers =
    slow: marks tests as slow
    phase8: phase 8 integration tests
    coverage: marks high-coverage tests
minversion = 7.0
asyncio_mode = strict
