apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cluster-config
  namespace: jpmorgan-apis
data:
  redis.conf: |
    cluster-enabled yes
    cluster-config-file /data/nodes.conf
    cluster-node-timeout 5000
    appendonly yes
    protected-mode no
    bind 0.0.0.0
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  namespace: jpmorgan-apis
  labels:
    app: redis-cluster
spec:
  serviceName: redis-cluster
  replicas: 6
  selector:
    matchLabels:
      app: redis-cluster
  template:
    metadata:
      labels:
        app: redis-cluster
    spec:
      containers:
      - name: redis
        image: redis:7.0-alpine
        ports:
        - containerPort: 6379
          name: redis
        - containerPort: 16379
          name: cluster
        command:
        - redis-server
        - /etc/redis/redis.conf
        volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: redis-config
          mountPath: /etc/redis
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: redis-config
        configMap:
          name: redis-cluster-config
  volumeClaimTemplates:
  - metadata:
    name: redis-data
    namespace: jpmorgan-apis
  spec:
    accessModes: ["ReadWriteOnce"]
    resources:
      requests:
        storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster
  namespace: jpmorgan-apis
  labels:
    app: redis-cluster
spec:
  type: ClusterIP
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
  - name: cluster
    port: 16379
    targetPort: 16379
    protocol: TCP
  selector:
    app: redis-cluster
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-init
  namespace: jpmorgan-apis
spec:
  template:
    spec:
      containers:
      - name: redis-cluster-init
        image: redis:7.0-alpine
        command:
        - sh
        - -c
        - |
          echo "Waiting for all Redis nodes to be ready..."
          for i in $(seq 0 5); do
            while ! redis-cli -h redis-cluster-$i.redis-cluster.jpmorgan-apis.svc.cluster.local ping; do
              echo "Waiting for redis-cluster-$i..."
              sleep 2
            done
          done

          echo "Creating Redis cluster..."
          redis-cli --cluster create \
            redis-cluster-0.redis-cluster.jpmorgan-apis.svc.cluster.local:6379 \
            redis-cluster-1.redis-cluster.jpmorgan-apis.svc.cluster.local:6379 \
            redis-cluster-2.redis-cluster.jpmorgan-apis.svc.cluster.local:6379 \
            redis-cluster-3.redis-cluster.jpmorgan-apis.svc.cluster.local:6379 \
            redis-cluster-4.redis-cluster.jpmorgan-apis.svc.cluster.local:6379 \
            redis-cluster-5.redis-cluster.jpmorgan-apis.svc.cluster.local:6379 \
            --cluster-replicas 1 \
            --cluster-yes
      restartPolicy: Never
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-cluster-monitor
  namespace: jpmorgan-apis
  labels:
    app: redis-cluster
spec:
  selector:
    matchLabels:
      app: redis-cluster
  endpoints:
  - port: redis
    interval: 30s
    path: /metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-exporter-config
  namespace: jpmorgan-apis
data:
  redis-exporter.conf: |
    REDIS_ADDR=redis-cluster:6379
    REDIS_PASSWORD=
    REDIS_ALIAS=redis-cluster
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: jpmorgan-apis
  labels:
    app: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
      - name: redis-exporter
        image: oliver006/redis_exporter:latest
        ports:
        - containerPort: 9121
          name: metrics
        env:
        - name: REDIS_ADDR
          value: "redis-cluster:6379"
        - name: REDIS_ALIAS
          value: "redis-cluster"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: redis-exporter-autoscaler
  namespace: jpmorgan-apis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: redis-exporter
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
