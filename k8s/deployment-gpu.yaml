apiVersion: apps/v1
kind: Deployment
metadata:
  name: jpmorgan-api-gpu
  namespace: default
  labels:
    app: jpmorgan-api-gpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jpmorgan-api-gpu
  template:
    metadata:
      labels:
        app: jpmorgan-api-gpu
    spec:
      # GPU node selector
      nodeSelector:
        accelerator: nvidia-tesla-k80  # Adjust based on your GPU type
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: jpmorgan-api-gpu
        image: jpmorgan/financial-apis:gpu
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: FLASK_RUN_PORT
          value: "5000"
        - name: DATABASE_URL
          value: "postgresql://telemetry_user:$(DATABASE_PASSWORD)@postgres-service:5432/telemetry_db"
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis-service:6379/0"
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: GPU_MEMORY_FRACTION
          value: "0.8"
        - name: TF_FORCE_GPU_ALLOW_GROWTH
          value: "true"
        envFrom:
        - configMapRef:
            name: jpmorgan-api-config
        - secretRef:
            name: jpmorgan-api-secrets
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
            nvidia.com/gpu: 1  # Request 1 GPU
          limits:
            memory: "2Gi"
            cpu: "2000m"
            nvidia.com/gpu: 1  # Limit to 1 GPU
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: telemetry-db
          mountPath: /app/data
        - name: gpu-cache
          mountPath: /root/.cache
      volumes:
      - name: logs
        emptyDir: {}
      - name: telemetry-db
        persistentVolumeClaim:
          claimName: telemetry-db-pvc
      - name: gpu-cache
        emptyDir: {}
