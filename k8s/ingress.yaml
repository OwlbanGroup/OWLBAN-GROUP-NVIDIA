apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jpmorgan-api-ingress
  namespace: jpmorgan-apis
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.jpmorgan.com;";
spec:
  tls:
  - hosts:
    - api.jpmorgan.com
    - grafana.jpmorgan.com
    - prometheus.jpmorgan.com
    secretName: jpmorgan-tls
  rules:
  - host: api.jpmorgan.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jpmorgan-api
            port:
              number: 80
      - path: /health
        pathType: Exact
        backend:
          service:
            name: jpmorgan-api
            port:
              number: 80
      - path: /metrics
        pathType: Exact
        backend:
          service:
            name: jpmorgan-api
            port:
              number: 80
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: jpmorgan-api
            port:
              number: 80
  - host: grafana.jpmorgan.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 80
  - host: prometheus.jpmorgan.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus
            port:
              number: 9090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jpmorgan-developer-portal-ingress
  namespace: jpmorgan-apis
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/rate-limit: "50"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
spec:
  tls:
  - hosts:
    - developers.jpmorgan.com
    secretName: jpmorgan-developer-tls
  rules:
  - host: developers.jpmorgan.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jpmorgan-developer-portal
            port:
              number: 80
      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: jpmorgan-developer-portal
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: jpmorgan-developer-portal
            port:
              number: 80

