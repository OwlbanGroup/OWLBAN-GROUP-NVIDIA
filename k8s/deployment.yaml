apiVersion: apps/v1
kind: Deployment
metadata:
  name: jpmorgan-api
  namespace: default
  labels:
    app: jpmorgan-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jpmorgan-api
  template:
    metadata:
      labels:
        app: jpmorgan-api
    spec:
      containers:
      - name: jpmorgan-api
        image: jpmorgan/financial-apis:latest
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: FLASK_RUN_PORT
          value: "5000"
        - name: DATABASE_URL
          value: "postgresql://telemetry_user:$(DATABASE_PASSWORD)@postgres-service:5432/telemetry_db"
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis-service:6379/0"
        - name: GPU_MEMORY_FRACTION
          value: "0.8"
        envFrom:
        - configMapRef:
            name: jpmorgan-api-config
        - secretRef:
            name: jpmorgan-api-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: telemetry-db
          mountPath: /app/data
      volumes:
      - name: logs
        emptyDir: {}
      - name: telemetry-db
        persistentVolumeClaim:
          claimName: telemetry-db-pvc
