apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jpmorgan-financial-apis-hpa
  namespace: jpmorgan-apis
  labels:
    app: jpmorgan-financial-apis
    component: api-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jpmorgan-financial-apis
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: 100
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jpmorgan-ml-worker-hpa
  namespace: jpmorgan-apis
  labels:
    app: jpmorgan-financial-apis
    component: ml-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jpmorgan-ml-worker
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85
  - type: Pods
    pods:
      metric:
        name: gpu_utilization_percent
      target:
        type: AverageValue
        averageValue: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 25
        periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hpa-config
  namespace: jpmorgan-apis
data:
  # HPA configuration parameters
  min-replicas-api: "2"
  max-replicas-api: "20"
  cpu-target-api: "70"
  memory-target-api: "80"
  requests-target: "100"

  min-replicas-ml: "1"
  max-replicas-ml: "10"
  cpu-target-ml: "75"
  memory-target-ml: "85"
  gpu-target-ml: "80"
