apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql-primary
  namespace: jpmorgan-apis
  labels:
    app: postgresql
    role: primary
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
      role: primary
  template:
    metadata:
      labels:
        app: postgresql
        role: primary
    spec:
      containers:
      - name: postgresql
        image: postgres:14-alpine
        ports:
        - containerPort: 5432
          name: postgresql
        env:
        - name: POSTGRES_DB
          value: "jpmorgan_financial_apis"
        - name: POSTGRES_USER
          value: "jpmorgan_user"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: password
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgresql-data
          mountPath: /var/lib/postgresql/data
        - name: postgresql-config
          mountPath: /etc/postgresql/postgresql.conf
          subPath: postgresql.conf
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - jpmorgan_user
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - jpmorgan_user
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgresql-data
        persistentVolumeClaim:
          claimName: postgresql-primary-pvc
      - name: postgresql-config
        configMap:
          name: postgresql-config
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql-replica
  namespace: jpmorgan-apis
  labels:
    app: postgresql
    role: replica
spec:
  serviceName: postgresql-replica
  replicas: 2
  selector:
    matchLabels:
      app: postgresql
      role: replica
  template:
    metadata:
      labels:
        app: postgresql
        role: replica
    spec:
      containers:
      - name: postgresql
        image: postgres:14-alpine
        ports:
        - containerPort: 5432
          name: postgresql
        env:
        - name: POSTGRES_DB
          value: "jpmorgan_financial_apis"
        - name: POSTGRES_USER
          value: "jpmorgan_user"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: password
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        - name: POSTGRES_MASTER_SERVICE_HOST
          value: "postgresql-primary"
        - name: POSTGRES_MASTER_SERVICE_PORT
          value: "5432"
        volumeMounts:
        - name: postgresql-data
          mountPath: /var/lib/postgresql/data
        - name: postgresql-config
          mountPath: /etc/postgresql/postgresql.conf
          subPath: postgresql.conf
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - jpmorgan_user
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - jpmorgan_user
          initialDelaySeconds: 30
          periodSeconds: 5
      volumes:
      - name: postgresql-data
        persistentVolumeClaim:
          claimName: postgresql-replica-pvc
      - name: postgresql-config
        configMap:
          name: postgresql-config
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-primary
  namespace: jpmorgan-apis
  labels:
    app: postgresql
    role: primary
spec:
  selector:
    app: postgresql
    role: primary
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-replica
  namespace: jpmorgan-apis
  labels:
    app: postgresql
    role: replica
spec:
  selector:
    app: postgresql
    role: replica
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-config
  namespace: jpmorgan-apis
data:
  postgresql.conf: |
    # PostgreSQL configuration for replication
    listen_addresses = '*'
    max_connections = 100
    shared_buffers = 256MB
    effective_cache_size = 1GB
    maintenance_work_mem = 64MB
    checkpoint_completion_target = 0.9
    wal_buffers = 16MB
    default_statistics_target = 100

    # Replication settings
    wal_level = replica
    max_wal_senders = 10
    wal_keep_size = 64MB
    hot_standby = on
    hot_standby_feedback = on

    # Logging
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    log_statement = 'ddl'
    log_timezone = 'UTC'

    # Performance tuning
    random_page_cost = 1.1
    effective_io_concurrency = 200
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: jpmorgan-apis
type: Opaque
data:
  # Base64 encoded password - replace with actual value
  password: "am9ibW9yZ2FuX3Bhc3N3b3Jk"  # jpmorgan_password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-primary-pvc
  namespace: jpmorgan-apis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: fast-ssd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-replica-pvc
  namespace: jpmorgan-apis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: fast-ssd
