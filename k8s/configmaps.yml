apiVersion: v1
kind: ConfigMap
metadata:
  name: jpmorgan-api-config
  namespace: jpmorgan-apis
  labels:
    app: jpmorgan-api
data:
  FLASK_ENV: "production"
  FLASK_DEBUG: "false"
  TESTING: "false"
  LOG_LEVEL: "INFO"
  METRICS_ENABLED: "true"
  GPU_ENABLED: "false"
  PROMETHEUS_MULTIPROC_DIR: "/tmp"
  REDIS_MAX_CONNECTIONS: "20"
  DATABASE_POOL_SIZE: "20"
  DATABASE_MAX_OVERFLOW: "30"
  SESSION_TIMEOUT: "3600"
  API_RATE_LIMIT: "1000"
  CACHE_TTL: "300"
  ML_MODEL_CACHE_SIZE: "100"
  TELEMETRY_BATCH_SIZE: "1000"
  ANOMALY_DETECTION_THRESHOLD: "0.95"
  GPU_MEMORY_FRACTION: "0.8"
  CUDA_VISIBLE_DEVICES: "0"
  WORKER_PROCESSES: "4"
  WORKER_THREADS: "2"
  MAX_REQUESTS_PER_WORKER: "1000"
  REQUEST_TIMEOUT: "30"
  GRACEFUL_TIMEOUT: "30"
  KEEP_ALIVE: "10"
  BACKLOG: "2048"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: jpmorgan-apis
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: jpmorgan-prod
        region: us-east-1

    rule_files:
      - "/etc/prometheus/alerts.yml"

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager.jpmorgan-apis.svc.cluster.local:9093

    scrape_configs:
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      - job_name: 'kubernetes-nodes'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      - job_name: 'jpmorgan-api'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: jpmorgan-api
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: 8000
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

      - job_name: 'redis-exporter'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: redis-exporter
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: 9121
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)

      - job_name: 'postgres-exporter'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: postgres-exporter
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: 9187
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)

      - job_name: 'nvidia-gpu'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: nvidia-dcgm-exporter
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: 9400
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)

      - job_name: 'istio-mesh'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_istio_io_statsInclusionRegex]
            action: keep
            regex: .+
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod_name
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: jpmorgan-apis
  labels:
    app: alertmanager
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'smtp.jpmorgan.com:587'
      smtp_from: 'alerts@jpmorgan.com'
      smtp_auth_username: 'alerts@jpmorgan.com'
      smtp_auth_password: 'CHANGE_THIS_PASSWORD'

    templates:
      - '/etc/alertmanager/templates/*.tmpl'

    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'jpmorgan-alerts'
      routes:
        - match:
            severity: critical
          receiver: 'jpmorgan-critical'
        - match:
            severity: warning
          receiver: 'jpmorgan-warnings'
        - match_re:
            service: ^jpmorgan-.*
          receiver: 'jpmorgan-devops'

    receivers:
      - name: 'jpmorgan-alerts'
        email_configs:
          - to: 'devops@jpmorgan.com'
            subject: '{{ .GroupLabels.alertname }} - {{ .GroupLabels.cluster }}'
            body: |
              {{ range .Alerts }}
              Alert: {{ .Annotations.summary }}
              Description: {{ .Annotations.description }}
              Runbook: {{ .Annotations.runbook_url }}
              {{ end }}
        slack_configs:
          - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
            channel: '#jpmorgan-alerts'
            title: '{{ .GroupLabels.alertname }}'
            text: '{{ .CommonAnnotations.summary }}'

      - name: 'jpmorgan-critical'
        email_configs:
          - to: 'oncall@jpmorgan.com'
            subject: 'CRITICAL: {{ .GroupLabels.alertname }} - {{ .GroupLabels.cluster }}'
        slack_configs:
          - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
            channel: '#jpmorgan-critical'
            title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
            text: '{{ .CommonAnnotations.summary }}'

      - name: 'jpmorgan-warnings'
        email_configs:
          - to: 'devops@jpmorgan.com'
            subject: 'WARNING: {{ .GroupLabels.alertname }} - {{ .GroupLabels.cluster }}'
        slack_configs:
          - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
            channel: '#jpmorgan-warnings'
            title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
            text: '{{ .CommonAnnotations.summary }}'

      - name: 'jpmorgan-devops'
        email_configs:
          - to: 'devops@jpmorgan.com'
            subject: 'JPMorgan Service Alert: {{ .GroupLabels.alertname }}'
        slack_configs:
          - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
            channel: '#jpmorgan-devops'
            title: '🔧 DevOps: {{ .GroupLabels.alertname }}'
            text: '{{ .CommonAnnotations.summary }}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: jpmorgan-apis
  labels:
    app: grafana
data:
  grafana.ini: |
    [server]
    http_port = 3000
    domain = grafana.jpmorgan.com
    root_url = https://grafana.jpmorgan.com

    [security]
    admin_user = admin
    admin_password = ${GRAFANA_ADMIN_PASSWORD}
    secret_key = ${GRAFANA_SECRET_KEY}
    disable_gravatar = true
    allow_embedding = true

    [auth]
    disable_login_form = false
    oauth_auto_login = false

    [auth.anonymous]
    enabled = true
    org_name = JPMorgan
    org_role = Viewer

    [database]
    type = sqlite3
    path = /var/lib/grafana/grafana.db

    [session]
    provider = memory

    [analytics]
    reporting_enabled = false
    check_for_updates = false

    [alerting]
    enabled = true
    execute_alerts = true

    [metrics]
    enabled = true

    [log]
    mode = console
    level = info

    [log.console]
    level = info
    format = text
