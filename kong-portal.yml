_format_version: "1.1"

# Kong Dev Portal Configuration
# This file defines the API documentation and developer portal setup

info:
  title: "JPMorgan Financial APIs"
  description: "Enterprise-grade API for processing Microsoft Windows Store telemetry data with ML anomaly detection, cloud integration, business asset management, JPMorgan Private Bank services, and comprehensive audit logging."
  version: "1.0.0"
  contact:
    name: "JPMorgan API Support"
    email: "api-support@jpmorgan.com"
    url: "https://developer.jpmorgan.com"

servers:
  - url: "https://api.jpmorgan-financial.com"
    description: "Production server"
  - url: "https://api-staging.jpmorgan-financial.com"
    description: "Staging server"
  - url: "http://localhost:8000"
    description: "Local development server"

security:
  - ApiKeyAuth: []
  - BearerAuth: []

paths:
  /health:
    get:
      summary: "Health Check"
      description: "Returns the health status of the API"
      operationId: "getHealth"
      tags:
        - "System"
      responses:
        "200":
          description: "API is healthy"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                    example: "1.0.0"

  /user/register:
    post:
      summary: "Register New User"
      description: "Create a new user account with authentication"
      operationId: "registerUser"
      tags:
        - "Authentication"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: "johndoe"
                password:
                  type: string
                  format: password
                  example: "securepassword123"
                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
                role:
                  type: string
                  enum: ["USER", "ADMIN"]
                  example: "USER"
      responses:
        "201":
          description: "User created successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "User created successfully"
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      username:
                        type: string
                        example: "johndoe"
                      email:
                        type: string
                        example: "john.doe@example.com"
                      role:
                        type: string
                        example: "USER"
                      created_at:
                        type: string
                        format: date-time

  /user/login:
    post:
      summary: "User Login"
      description: "Authenticate user and return JWT token"
      operationId: "loginUser"
      tags:
        - "Authentication"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: "johndoe"
                password:
                  type: string
                  format: password
                  example: "securepassword123"
      responses:
        "200":
          description: "Login successful"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  token:
                    type: string
                    description: "JWT authentication token"
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      username:
                        type: string
                        example: "johndoe"
                      email:
                        type: string
                        example: "john.doe@example.com"
                      role:
                        type: string
                        example: "USER"

  /telemetry:
    post:
      summary: "Process Telemetry Data"
      description: "Submit telemetry data for processing and anomaly detection"
      operationId: "processTelemetry"
      tags:
        - "Telemetry"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Telemetry event data"
      responses:
        "200":
          description: "Telemetry processed successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Telemetry data processed successfully"
                  timestamp:
                    type: string
                    format: date-time

  /api/jpmorgan-data:
    get:
      summary: "Get JPMorgan Financial Data"
      description: "Retrieve JPMorgan financial metrics, assets, and stock ticker information with optional filtering"
      operationId: "getJPMorganData"
      tags:
        - "Financial Data"
      security:
        - BearerAuth: []
      parameters:
        - name: env
          in: query
          schema:
            type: string
            enum: ["prod", "stage", "dev"]
          description: "Filter by environment"
        - name: region
          in: query
          schema:
            type: string
            enum: ["US", "EU", "APAC"]
          description: "Filter by region"
        - name: payment_type
          in: query
          schema:
            type: string
            enum: ["ACH", "Card", "Wallet"]
          description: "Filter by payment type"
        - name: status
          in: query
          schema:
            type: string
            enum: ["success", "pending", "failed"]
          description: "Filter by status"
      responses:
        "200":
          description: "Financial data retrieved successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  financial_metrics:
                    type: array
                    items:
                      type: object
                      properties:
                        env:
                          type: string
                        region:
                          type: string
                        revenue:
                          type: number
                          format: float
                        net_income:
                          type: number
                          format: float
                        total_assets:
                          type: number
                          format: float
                        market_cap:
                          type: number
                          format: float
                        pe_ratio:
                          type: number
                          format: float
                        dividend_yield:
                          type: number
                          format: float
                        debt_to_equity:
                          type: number
                          format: float
                        return_on_equity:
                          type: number
                          format: float
                        last_updated:
                          type: string
                          format: date-time
                  assets:
                    type: array
                    items:
                      type: object
                      properties:
                        asset_id:
                          type: string
                        name:
                          type: string
                        type:
                          type: string
                        value:
                          type: number
                          format: float
                        description:
                          type: string
                        env:
                          type: string
                        region:
                          type: string
                        payment_type:
                          type: string
                        status:
                          type: string
                  stock_tickers:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        company_name:
                          type: string
                        exchange:
                          type: string
                        current_price:
                          type: number
                          format: float
                        change:
                          type: number
                          format: float
                        change_percent:
                          type: number
                          format: float
                        volume:
                          type: integer
                        market_cap:
                          type: number
                          format: float
                        env:
                          type: string
                        region:
                          type: string
                        payment_type:
                          type: string
                        status:
                          type: string
                        last_updated:
                          type: string
                          format: date-time
                  filters_applied:
                    type: object
                    properties:
                      env:
                        type: string
                        nullable: true
                      region:
                        type: string
                        nullable: true
                      payment_type:
                        type: string
                        nullable: true
                      status:
                        type: string
                        nullable: true
                  timestamp:
                    type: string
                    format: date-time

  /businesses:
    get:
      summary: "List Businesses"
      description: "Retrieve a list of all businesses"
      operationId: "listBusinesses"
      tags:
        - "Business Management"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: "Businesses retrieved successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  businesses:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        description:
                          type: string
                        industry:
                          type: string
                        revenue:
                          type: number
                          format: float
                        employee_count:
                          type: integer
                        founded_year:
                          type: integer
                        website:
                          type: string
                          format: uri
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                  count:
                    type: integer
                  timestamp:
                    type: string
                    format: date-time
    post:
      summary: "Create Business"
      description: "Create a new business record"
      operationId: "createBusiness"
      tags:
        - "Business Management"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "Acme Corporation"
                description:
                  type: string
                  example: "Leading technology company"
                industry:
                  type: string
                  example: "Technology"
                revenue:
                  type: number
                  format: float
                  example: 1000000.0
                employee_count:
                  type: integer
                  example: 500
                founded_year:
                  type: integer
                  example: 2010
                website:
                  type: string
                  format: uri
                  example: "https://www.acme.com"
      responses:
        "201":
          description: "Business created successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  business:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: "Acme Corporation"
                      description:
                        type: string
                        example: "Leading technology company"
                      industry:
                        type: string
                        example: "Technology"
                      revenue:
                        type: number
                        format: float
                        example: 1000000.0
                      employee_count:
                        type: integer
                        example: 500
                      founded_year:
                        type: integer
                        example: 2010
                      website:
                        type: string
                        format: uri
                        example: "https://www.acme.com"
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                  timestamp:
                    type: string
                    format: date-time

  /private-bank/accounts:
    get:
      summary: "Get Private Bank Accounts"
      description: "Retrieve private banking account information"
      operationId: "getPrivateBankAccounts"
      tags:
        - "Private Banking"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: "Private bank accounts retrieved successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        account_id:
                          type: string
                          example: "PB-001"
                        account_type:
                          type: string
                          example: "Private Banking"
                        balance:
                          type: number
                          format: float
                          example: 2500000.0
                        currency:
                          type: string
                          example: "USD"
                        status:
                          type: string
                          example: "active"
                        last_updated:
                          type: string
                          format: date-time
                  count:
                    type: integer
                    example: 2
                  timestamp:
                    type: string
                    format: date-time

  /audit/logs:
    get:
      summary: "Query Audit Logs"
      description: "Retrieve audit logs with optional filtering"
      operationId: "getAuditLogs"
      tags:
        - "Audit & Compliance"
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: query
          schema:
            type: string
          description: "Filter by user ID"
        - name: action
          in: query
          schema:
            type: string
          description: "Filter by action type"
        - name: resource_type
          in: query
          schema:
            type: string
          description: "Filter by resource type"
        - name: severity
          in: query
          schema:
            type: string
            enum: ["info", "warning", "error", "critical"]
          description: "Filter by severity level"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: "Maximum number of results to return"
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Number of results to skip"
      responses:
        "200":
          description: "Audit logs retrieved successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  logs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
                        user_id:
                          type: string
                        action:
                          type: string
                        resource_type:
                          type: string
                        resource_id:
                          type: string
                        status_code:
                          type: integer
                        severity:
                          type: string
                        category:
                          type: string
                        compliance_tags:
                          type: array
                          items:
                            type: string
                        details:
                          type: object
                  count:
                    type: integer
                  timestamp:
                    type: string
                    format: date-time

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: "API Key for authentication"
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT Bearer token for authentication"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        status:
          type: string
          example: "error"
      required:
        - error
        - status

tags:
  - name: "System"
    description: "System health and monitoring endpoints"
  - name: "Authentication"
    description: "User authentication and authorization"
  - name: "Telemetry"
    description: "Telemetry data processing and analytics"
  - name: "Financial Data"
    description: "JPMorgan financial data and metrics"
  - name: "Business Management"
    description: "Business and asset management"
  - name: "Private Banking"
    description: "Private banking services"
  - name: "Audit & Compliance"
    description: "Audit logging and compliance reporting"
