version: '3.8'

services:
  # Kong API Gateway
  kong:
    image: kong:3.4
    container_name: kong-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/opt/kong/kong.yml"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
      KONG_PROXY_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_ADMIN_GUI_URL: "http://localhost:8002"
      KONG_PLUGINS: "bundled,cors,rate-limiting,key-auth,request-transformer,response-transformer,prometheus"
    ports:
      - "8000:8000"  # Kong proxy port
      - "8443:8443"  # Kong proxy SSL port
      - "8001:8001"  # Kong admin API
      - "8444:8444"  # Kong admin SSL
      - "8002:8002"  # Kong Manager GUI
    volumes:
      - ./kong.yml:/opt/kong/kong.yml:ro
    depends_on:
      - flask-api
    networks:
      - kong-net
    restart: unless-stopped

  # Kong Dev Portal (optional)
  kong-portal:
    image: kong/kong-portal:0.4
    container_name: kong-portal
    environment:
      KONG_PORTAL_GUI_PROTOCOL: "http"
      KONG_PORTAL_GUI_HOST: "0.0.0.0:8003"
      KONG_PORTAL_API_URL: "http://kong:8001"
    ports:
      - "8003:8003"  # Kong Dev Portal
    depends_on:
      - kong
    networks:
      - kong-net
    restart: unless-stopped

  # Flask API Backend
  flask-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jpmorgan-flask-api
    environment:
      - FLASK_ENV=production
      - TESTING=0
      - FLASK_RUN_PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/__pycache__
    networks:
      - kong-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - kong-net
    restart: unless-stopped

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana_dashboard.json:/etc/grafana/provisioning/dashboards/jpmorgan-dashboard.json:ro
    networks:
      - kong-net
    restart: unless-stopped

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - kong-net
    restart: unless-stopped

  # PostgreSQL database
  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      - POSTGRES_DB=jpmorgan_financial
      - POSTGRES_USER=jpmorgan_user
      - POSTGRES_PASSWORD=jpmorgan_password_2024
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./jpmorgan_database_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init_database.py:/docker-entrypoint-initdb.d/02-init.py:ro
    networks:
      - kong-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jpmorgan_user -d jpmorgan_financial"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cloud is used for caching (no local Redis container needed)
  # Configure REDIS_URL environment variable with your Redis Cloud connection URL

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:

networks:
  kong-net:
    driver: bridge
