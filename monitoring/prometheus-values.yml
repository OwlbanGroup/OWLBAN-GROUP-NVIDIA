# Prometheus Helm Chart Values for JPMorgan Financial APIs
global:
  scrape_interval: 15s
  evaluation_interval: 15s

server:
  image:
    repository: prom/prometheus
    tag: v2.40.0
  persistentVolume:
    enabled: true
    size: 50Gi
    storageClass: "fast-ssd"
  retention: "200h"
  resources:
    requests:
      memory: 2Gi
      cpu: 1000m
    limits:
      memory: 4Gi
      cpu: 2000m
  securityContext:
    runAsUser: 65534
    runAsNonRoot: true
    runAsGroup: 65534
    fsGroup: 65534
  service:
    type: ClusterIP
    port: 9090
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9090"

alertmanager:
  enabled: true
  image:
    repository: prom/alertmanager
    tag: v0.25.0
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: "fast-ssd"
  resources:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 1Gi
      cpu: 1000m
  config:
    global:
      smtp_smarthost: 'smtp.jpmorgan.com:587'
      smtp_from: 'alerts@jpmorgan.com'
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'jpmorgan-alerts'
      routes:
        - match:
            severity: critical
          receiver: 'jpmorgan-critical'
    receivers:
      - name: 'jpmorgan-alerts'
        email_configs:
          - to: 'devops@jpmorgan.com'
            subject: '{{ .GroupLabels.alertname }} - {{ .GroupLabels.cluster }}'
      - name: 'jpmorgan-critical'
        email_configs:
          - to: 'oncall@jpmorgan.com'
            subject: 'CRITICAL: {{ .GroupLabels.alertname }} - {{ .GroupLabels.cluster }}'

nodeExporter:
  enabled: true
  image:
    repository: prom/node-exporter
    tag: v1.5.0
  resources:
    requests:
      memory: 64Mi
      cpu: 100m
    limits:
      memory: 128Mi
      cpu: 200m

kubeStateMetrics:
  enabled: true
  image:
    repository: k8s.gcr.io/kube-state-metrics/kube-state-metrics
    tag: v2.7.0
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

pushgateway:
  enabled: false

serverFiles:
  alerts.yml: |
    groups:
      - name: jpmorgan_alerts
        rules:
          - alert: HighErrorRate
            expr: rate(errors_total[5m]) > 0.1
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "High error rate detected"
              description: "Error rate is above 10% for more than 2 minutes"

          - alert: HighLatency
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High request latency"
              description: "95th percentile latency is above 2 seconds for more than 2 minutes"

          - alert: ServiceDown
            expr: up{job="jpmorgan-api"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "JPMorgan API service is down"
              description: "The JPMorgan API service has been down for more than 1 minute"

          - alert: HighGPUTemperature
            expr: gpu_temperature_celsius > 85
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High GPU temperature"
              description: "GPU temperature is above 85°C for more than 2 minutes"

          - alert: DatabaseConnectionHigh
            expr: db_connections_active > 50
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High database connections"
              description: "Database has more than 50 active connections for more than 2 minutes"

          - alert: RedisMemoryHigh
            expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High Redis memory usage"
              description: "Redis memory usage is above 80% for more than 5 minutes"

          - alert: PodRestartHigh
            expr: increase(kube_pod_container_status_restarts_total[1h]) > 5
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High pod restart rate"
              description: "Pod has restarted more than 5 times in the last hour"

          - alert: NodeCPUHigh
            expr: (1 - rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High node CPU usage"
              description: "Node CPU usage is above 85% for more than 5 minutes"

          - alert: NodeMemoryHigh
            expr: (1 - rate(node_memory_MemAvailable_bytes[5m]) / rate(node_memory_MemTotal_bytes[5m])) * 100 > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High node memory usage"
              description: "Node memory usage is above 85% for more than 5 minutes"

          - alert: DiskSpaceLow
            expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Low disk space"
              description: "Disk space is below 10% for more than 5 minutes"
