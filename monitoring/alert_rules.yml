groups:
  - name: jpmorgan_api_alerts
    rules:
    - alert: HighErrorRate
      expr: rate(http_requests_total{status_code=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "High error rate detected"
        description: "Error rate is {{ $value }}% (5xx responses)"

    - alert: HighLatency
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High request latency"
        description: "95th percentile latency is {{ $value }}s"

    - alert: LowSuccessRate
      expr: rate(http_requests_total{status_code=~"2.."}[5m]) / rate(http_requests_total[5m]) < 0.95
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Low success rate"
        description: "Success rate is {{ $value }}%"

    - alert: DatabaseConnectionIssues
      expr: up{job="postgres-exporter"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Database connection lost"
        description: "PostgreSQL database is down"

    - alert: RedisConnectionIssues
      expr: up{job="redis-exporter"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Redis connection lost"
        description: "Redis cache is down"

    - alert: HighMemoryUsage
      expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage"
        description: "Memory usage is {{ $value }}%"

    - alert: HighCPUUsage
      expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage"
        description: "CPU usage is {{ $value }}%"

    - alert: DiskSpaceLow
      expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Low disk space"
        description: "Disk space is {{ $value }}% available"
