global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@jpmorgan.com'
  smtp_auth_username: 'alerts@jpmorgan.com'
  smtp_auth_password: 'your-smtp-password'

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'jpmorgan-team'
  routes:
  - match:
      severity: critical
    receiver: 'jpmorgan-critical'

receivers:
- name: 'jpmorgan-team'
  email_configs:
  - to: 'team@jpmorgan.com'
    send_resolved: true

- name: 'jpmorgan-critical'
  email_configs:
  - to: 'critical@jpmorgan.com'
    send_resolved: true
  slack_configs:
  - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    channel: '#alerts-critical'
    send_resolved: true
