name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.9'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_new.txt
        pip install flake8 black mypy bandit safety pytest pytest-cov

    - name: Run code quality checks
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code formatting with Black
      run: |
        black --check --diff src/

    - name: Run type checking with mypy
      run: |
        mypy src/ --ignore-missing-imports --no-strict-optional

    - name: Run security scanning with Bandit
      run: |
        bandit -r src/ -f json -o security_report.json || true
        # Check if there are any high-severity issues
        if [ $(jq '.results | map(select(.issue_severity == "high")) | length' security_report.json) -gt 0 ]; then
          echo "High-severity security issues found!"
          jq '.results[] | select(.issue_severity == "high")' security_report.json
          exit 1
        fi

    - name: Check dependencies for vulnerabilities
      run: |
        safety check --json | jq '.vulnerabilities' > vulnerabilities.json || true
        # Fail if there are any vulnerabilities
        if [ -s vulnerabilities.json ] && [ "$(cat vulnerabilities.json)" != "[]" ]; then
          echo "Security vulnerabilities found in dependencies!"
          cat vulnerabilities.json
          exit 1
        fi

    - name: Run unit tests
      run: |
        pytest --cov=src/ --cov-report=xml --cov-report=term-missing
      env:
        REDIS_URL: redis://localhost:6379/0
        TESTING: true

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  build-and-push-docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: jpmorgan/telemetry-api
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  performance-test:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        pip install locust requests

    - name: Run performance tests
      run: |
        # Start a simple performance test
        python -c "
        import requests
        import time
        import statistics

        # Simple performance benchmark
        times = []
        for i in range(10):
            start = time.time()
            try:
                response = requests.get('http://localhost:5000/health', timeout=5)
                end = time.time()
                if response.status_code == 200:
                    times.append(end - start)
            except:
                pass

        if times:
            avg_time = statistics.mean(times)
            print(f'Average response time: {avg_time:.3f}s')
            # Fail if average response time is > 1 second
            if avg_time > 1.0:
                print('Performance regression detected!')
                exit(1)
        else:
            print('Could not perform performance test')
            exit(1)
        "

  security-scan:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
