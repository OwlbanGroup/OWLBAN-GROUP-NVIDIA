name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run lint checks (ruff + pylint)
        # tests/ must be clean; application modules may only carry findings
        # already frozen in .ruff-baseline.txt. See scripts/lint.sh for the
        # gate and how to regenerate the baseline.
        run: PYTHON=python bash scripts/lint.sh

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11"]
    env:
      API_PASSWORD: ci-test-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run test suite
        run: pytest tests/ -q --tb=short --timeout=300 --timeout-method=thread -p no:cacheprovider

      - name: Verify API server starts
        run: |
          python -m uvicorn api_server:fastapi_app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          # Wait up to 30s for the server to listen
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8000/; then break; fi
            sleep 1
          done
          # Server must reject bad credentials with 401
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -u owlban_admin:wrongpass http://127.0.0.1:8000/)
          echo "Auth check returned HTTP $CODE"
          [ "$CODE" = "401" ] || { echo "FAIL: expected 401"; kill $SERVER_PID; exit 1; }
          kill $SERVER_PID
