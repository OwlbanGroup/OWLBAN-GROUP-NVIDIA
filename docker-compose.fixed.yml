

x-gateway_def: &gateway_def
  build:
    context: ./microservices
    dockerfile: ./api-gateway/Dockerfile
  container_name: jpmorgan_gateway
  ports:
    - "8000:8000"
  environment:
    - ENVIRONMENT=development
    - DATABASE_URL=postgresql://telemetry_user:telemetry_pass@postgres-telemetry:5432/telemetry_db
    - REDIS_URL=redis://:redis_pass@redis:6379
  depends_on:
    postgres-telemetry:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - jpm-net

services:


  postgres-telemetry:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: telemetry_db
      POSTGRES_USER: telemetry_user
      POSTGRES_PASSWORD: telemetry_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry_user"]
    volumes:
      - pg_telemetry:/var/lib/postgresql/data
    networks:
      - jpm-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass redis_pass
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_pass", "ping"]
    volumes:
      - redis_data:/data
    networks:
      - jpm-net

  gateway:
    <<: *gateway_def
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mcp-server:
    build:
      context: ./microservices/mcp-server
      dockerfile: Dockerfile
    container_name: jpmorgan_mcp_server
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_URL=http://gateway:8000
      - ENVIRONMENT=development
    depends_on:
      postgres-telemetry:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks:
      - jpm-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pg_telemetry:
  redis_data:

networks:
  jpm-net:
    driver: bridge

