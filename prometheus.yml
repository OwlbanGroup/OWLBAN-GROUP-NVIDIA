global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'telemetry-api'
    static_configs:
      - targets: ['app:8000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'telemetry-api-gpu'
    static_configs:
      - targets: ['localhost:5001']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'redis'
    static_configs:
      - targets: ['jpmorgan-redis-prod:6379']

  - job_name: 'postgres'
    static_configs:
      - targets: ['jpmorgan-postgres-prod:5432']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['jpmorgan-node-exporter-prod:9100']

  - job_name: 'nvidia-gpu'
    static_configs:
      - targets: ['localhost:9400']
    scrape_interval: 10s

  - job_name: 'dcgm-exporter'
    static_configs:
      - targets: ['localhost:9401']
    scrape_interval: 10s
