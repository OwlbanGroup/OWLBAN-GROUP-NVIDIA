global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Kong Gateway metrics
  - job_name: 'kong-gateway'
    static_configs:
      - targets: ['kong:8001']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Flask API metrics
  - job_name: 'jpmorgan-flask-api'
    static_configs:
      - targets: ['flask-api:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # PostgreSQL metrics (if using postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187']
    scrape_interval: 15s

  # Redis metrics (if using redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']
    scrape_interval: 15s

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # Kong Dev Portal metrics (if enabled)
  - job_name: 'kong-portal'
    static_configs:
      - targets: ['kong-portal:8004']
    metrics_path: '/metrics'
    scrape_interval: 15s
