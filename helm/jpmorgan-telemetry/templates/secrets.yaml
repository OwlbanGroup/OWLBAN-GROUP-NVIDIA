apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jpmorgan-telemetry.dbSecretName" . }}
  labels:
    {{- include "jpmorgan-telemetry.labels" . | nindent 4 }}
type: Opaque
data:
  database-url: {{ printf "postgresql://%s:%s@%s:%d/%s?sslmode=%s" .Values.database.user .Values.database.password .Values.database.host .Values.database.port .Values.database.name .Values.database.sslmode | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jpmorgan-telemetry.redisSecretName" . }}
  labels:
    {{- include "jpmorgan-telemetry.labels" . | nindent 4 }}
type: Opaque
data:
  redis-url: {{ printf "redis://:%s@%s:%d/0" .Values.redis.password .Values.redis.host .Values.redis.port | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jpmorgan-telemetry.encryptionSecretName" . }}
  labels:
    {{- include "jpmorgan-telemetry.labels" . | nindent 4 }}
type: Opaque
data:
  encryption-key: {{ .Values.encryption.key | b64enc }}
  encryption-salt: {{ .Values.encryption.salt | b64enc }}
