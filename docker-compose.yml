version: '3.9'\n\nx-gateway_def: &gateway_def\n  build:\n    context: ./microservices\n    dockerfile: ./api-gateway/Dockerfile\n  container_name: jpmorgan_gateway\n  ports:\n    - "8000:8000"\n  environment:\n    - ENVIRONMENT=development\n    - DATABASE_URL=postgresql://telemetry_user:telemetry_pass@postgres-telemetry:5432/telemetry_db\n    - REDIS_URL=redis://:redis_pass@redis:6379\n  depends_on:\n    postgres-telemetry:\n      condition: service_healthy\n    redis:\n      condition: service_healthy\n  networks:\n    - jpm-net\n\nservices:\n  # Entrypoint - delegates to profiles\n  gateway:\n    <<: *gateway_def\n    profiles: ["dev", "prod"]\n    healthcheck:\n      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n\n  profiles:\n    dev:\n      <<: *microservices_dev\n    prod:\n      <<: *microservices_prod\n    ai:\n      <<: *microservices_dev\n      services:\n        ml-service:\n          deploy:\n            resources:\n              reservations:\n                devices:\n                  - driver: nvidia\n                    count: 1\n                    capabilities: [gpu]\n        traction-service:\n          deploy:\n            resources:\n              reservations:\n                devices:\n                  - driver: nvidia\n                    count: 1\n                    capabilities: [gpu]\n        model-runner:\n          build:\n            context: ./microservices/model-runner\n            dockerfile: Dockerfile\n          container_name: jpmorgan_model_runner\n          ports:\n            - "11434:11434"\n          volumes:\n            - model_data:/root/.ollama/models\n          deploy:\n            resources:\n              reservations:\n                devices:\n                  - driver: nvidia\n                    count: 1\n                    capabilities: [gpu]\n          environment:\n            - NVIDIA_VISIBLE_DEVICES=all\n          depends_on:\n            gateway:\n              condition: service_healthy\n          networks:\n            - jpm-net\n          profiles: ["ai"]\n          healthcheck:\n            test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]\n            interval: 30s\n            timeout: 10s\n            retries: 5\n            start_period: 60s\n\n  x-microservices_dev: &microservices_dev\n    external: true  # Links to microservices/docker-compose.dev.yml\n\n  x-microservices_prod: &microservices_prod\n    external: true  # Links to microservices/docker-compose.prod.yml\n\n# Shared infra (minimal, delegate heavy infra to microservices/)\n  postgres-telemetry:\n    image: postgres:15-alpine\n    environment:\n      POSTGRES_DB: telemetry_db\n      POSTGRES_USER: telemetry_user\n      POSTGRES_PASSWORD: telemetry_pass\n    healthcheck:\n      test: ["CMD-SHELL", "pg_isready -U telemetry_user"]\n    volumes:\n      - pg_telemetry:/var/lib/postgresql/data\n    networks:\n      - jmp-net\n\n  redis:\n    image: redis:7-alpine\n    command: redis-server --appendonly yes --requirepass redis_pass\n    healthcheck:\n      test: ["CMD", "redis-cli", "-a", "redis_pass", "ping"]\n    volumes:\n      - redis_data:/data\n    networks:\n      - jpm-net\n\n  mcp-server:\n    build:\n      context: ./microservices/mcp-server\n      dockerfile: Dockerfile\n    container_name: jpmorgan_mcp_server\n    ports:\n      - "8080:8080"\n    environment:\n      - GATEWAY_URL=http://gateway:8000\n      - ENVIRONMENT=development\n    depends_on:\n      gateway:\n        condition: service_healthy\n      postgres-telemetry:\n        condition: service_healthy\n    networks:\n      - jpm-net\n    profiles: ["dev", "prod", "ai"]\n    healthcheck:\n      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n\nvolumes:\n  pg_telemetry:\n  redis_data:\n  model_data:\n\nnetworks:\n  jpm-net:\n    driver: bridge
