version: '3.8'

services:
  jpmorgan-api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - TESTING=0
      - DATABASE_URL=sqlite:///jpmorgan_api.db
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - jpmorgan-api
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./ssl:/etc/letsencrypt
    command: certonly --webroot --webroot-path=/var/www/html --email admin@equityshieldadvocates.com --agree-tos --no-eff-email -d api.equityshieldadvocates.com
