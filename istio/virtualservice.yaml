apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: jpmorgan-telemetry-vs
  namespace: production
spec:
  hosts:
  - api.jpmorgan.com
  gateways:
  - jpmorgan-telemetry-gateway
  http:
  - match:
    - uri:
        prefix: "/api/v1/telemetry"
    route:
    - destination:
        host: jpmorgan-telemetry-prod
        port:
          number: 5000
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
    corsPolicy:
      allowOrigins:
      - exact: "https://dashboard.jpmorgan.com"
      allowMethods: ["GET", "POST", "PUT", "DELETE"]
      allowHeaders: ["Authorization", "Content-Type"]
      allowCredentials: true
  - match:
    - uri:
        prefix: "/health"
    route:
    - destination:
        host: jpmorgan-telemetry-prod
        port:
          number: 5000
    timeout: 5s
  - match:
    - uri:
        prefix: "/"
    route:
    - destination:
        host: jpmorgan-telemetry-prod
        port:
          number: 5000
    timeout: 30s
