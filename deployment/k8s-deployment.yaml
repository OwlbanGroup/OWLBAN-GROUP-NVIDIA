apiVersion: apps/v1&#10;kind: Deployment&#10;metadata:&#10;  name: jpmorgan-gateway&#10;  namespace: jpmorgan&#10;spec:&#10;  replicas: 2&#10;  selector:&#10;    matchLabels:&#10;      app: gateway&#10;  template:&#10;    metadata:&#10;      labels:&#10;        app: gateway&#10;    spec:&#10;      containers:&#10;      - name: gateway&#10;        image: jpmorgan-financial-apis-gateway:latest&#10;        ports:&#10;        - containerPort: 8000&#10;        env:&#10;        - name: DATABASE_URL&#10;          value: "postgresql://telemetry_user:telemetry_pass@postgres-telemetry:5432/telemetry_db"&#10;        resources:&#10;          requests:&#10;            memory: "256Mi"&#10;            cpu: "250m"&#10;          limits:&#10;            memory: "512Mi"&#10;            cpu: "500m"&#10;---&#10;apiVersion: v1&#10;kind: Service&#10;metadata:&#10;  name: gateway-service&#10;  namespace: jpmorgan&#10;spec:&#10;  selector:&#10;    app: gateway&#10;  ports:&#10;  - port: 8000&#10;    targetPort: 8000&#10;  type: LoadBalancer&#10;---&#10;apiVersion: apps/v1&#10;kind: Deployment&#10;metadata:&#10;  name: mcp-server&#10;  namespace: jpmorgan&#10;spec:&#10;  replicas: 1&#10;  selector:&#10;    matchLabels:&#10;      app: mcp-server&#10;  template:&#10;    metadata:&#10;      labels:&#10;        app: mcp-server&#10;    spec:&#10;      containers:&#10;      - name: mcp-server&#10;        image: jpmorgan-financial-apis-mcp:latest&#10;        ports:&#10;        - containerPort: 8080&#10;        env:&#10;        - name: GATEWAY_URL&#10;          value: "http://gateway-service:8000"&#10;        resources:&#10;          requests:&#10;            memory: "128Mi"&#10;            cpu: "100m"&#10;---&#10;apiVersion: v1&#10;kind: Service&#10;metadata:&#10;  name: mcp-service&#10;  namespace: jpmorgan&#10;spec:&#10;  selector:&#10;    app: mcp-server&#10;  ports:&#10;  - port: 8080&#10;    targetPort: 8080&#10;---&#10;apiVersion: apps/v1&#10;kind: Deployment&#10;metadata:&#10;  name: model-runner&#10;  namespace: jpmorgan&#10;spec:&#10;  replicas: 1&#10;  selector:&#10;    matchLabels:&#10;      app: model-runner&#10;  template:&#10;    metadata:&#10;      labels:&#10;        app: model-runner&#10;    spec:&#10;      nodeSelector:&#10;        gpu: nvidia.com/gpu&#10;      containers:&#10;      - name: ollama&#10;        image: ollama/ollama:0.3.12-gpu&#10;        ports:&#10;        - containerPort: 11434&#10;        volumeMounts:&#10;        - mountPath: /root/.ollama&#10;          name: models&#10;      volumes:&#10;      - name: models&#10;        persistentVolumeClaim:&#10;          claimName: ollama-models-pvc&#10;---&#10;apiVersion: v1&#10;kind: Service&#10;metadata:&#10;  name: model-runner-service&#10;  namespace: jpmorgan&#10;spec:&#10;  selector:&#10;    app: model-runner&#10;  ports:&#10;  - port: 11434&#10;    targetPort: 11434&#10;---&#10;apiVersion: apps/v1&#10;kind: Deployment&#10;metadata:&#10;  name: postgres-telemetry&#10;  namespace: jpmorgan&#10;spec:&#10;  replicas: 1&#10;  selector:&#10;    matchLabels:&#10;      app: postgres&#10;  template:&#10;    metadata:&#10;      labels:&#10;        app: postgres&#10;    spec:&#10;      containers:&#10;      - name: postgres&#10;        image: postgres:15-alpine&#10;        env:&#10;        - name: POSTGRES_DB&#10;          value: telemetry_db&#10;        - name: POSTGRES_USER&#10;          value: telemetry_user&#10;        - name: POSTGRES_PASSWORD&#10;          valueFrom:&#10;            secretKeyRef:&#10;              name: postgres-secret&#10;              key: password&#10;        volumeMounts:&#10;        - mountPath: /var/lib/postgresql/data&#10;          name: pgdata&#10;      volumes:&#10;      - name: pgdata&#10;        persistentVolumeClaim:&#10;          claimName: postgres-pvc&#10;---&#10;# Namespace&#10;apiVersion: v1&#10;kind: Namespace&#10;metadata:&#10;  name: jpmorgan
