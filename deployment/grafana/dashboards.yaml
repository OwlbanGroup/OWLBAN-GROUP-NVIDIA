# Grafana Dashboard Configurations for JPMorgan Financial APIs
# Phase 8 - Post-Deployment Monitoring

---
# Prometheus Datasource Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: jpmorgan
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
      - name: Elasticsearch
        type: elasticsearch
        access: proxy
        url: http://elasticsearch:9200
        database: jpmorgan-*
        jsonData:
          timeField: "@timestamp"
          esVersion: 8

---
# API Gateway Dashboard
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-dashboard
  namespace: jpmorgan
data:
  dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "uid": "jpmorgan-gateway",
        "title": "JPMorgan API Gateway",
        "tags": ["jpmorgan", "gateway"],
        "timezone": "browser",
        "schemaVersion": 16,
        "version": 1,
        "refresh": "30s",
        "panels": [
          {
            "id": 1,
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
            "type": "graph",
            "title": "Request Rate (req/s)",
            "targets": [
              {
                "expr": "rate(http_requests_total{service=\"gateway\"}[5m])",
                "legendFormat": "{{method}} {{path}}",
                "refId": "A"
              }
            ],
            "yaxes": [
              {"format": "reqps", "label": "Requests/sec"},
              {"format": "short", "label": ""}
            ]
          },
          {
            "id": 2,
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
            "type": "graph",
            "title": "Response Time (P95/P99)",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{service=\"gateway\"}[5m]))",
                "legendFormat": "P95",
                "refId": "A"
              },
              {
                "expr": "histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{service=\"gateway\"}[5m]))",
                "legendFormat": "P99",
                "refId": "B"
              }
            ],
            "yaxes": [
              {"format": "s", "label": "Response Time"},
              {"format": "short", "label": ""}
            ]
          },
          {
            "id": 3,
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
            "type": "graph",
            "title": "Error Rate (%)",
            "targets": [
              {
                "expr": "rate(http_requests_total{service=\"gateway\",status=~\"5..\"}[5m]) / rate(http_requests_total{service=\"gateway\"}[5m]) * 100",
                "legendFormat": "5xx Errors",
                "refId": "A"
              }
            ],
            "yaxes": [
              {"format": "percent", "label": "Error %"},
              {"format": "short", "label": ""}
            ]
          },
          {
            "id": 4,
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
            "type": "stat",
            "title": "Active Connections",
            "targets": [
              {
                "expr": "sum(http_connections_active{service=\"gateway\"})",
                "legendFormat": "Active",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "orientation": "auto"
            }
          },
          {
            "id": 5,
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 16},
            "type": "table",
            "title": "Top Endpoints by Latency",
            "targets": [
              {
                "expr": "topk(10, histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{service=\"gateway\"}[5m])))",
                "legendFormat": "{{path}}",
                "refId": "A",
                "format": "table"
              }
            ]
          }
        ]
      }
    }

