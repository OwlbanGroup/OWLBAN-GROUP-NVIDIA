---
# VerticalPodAutoscaler for Gateway
apiVersion: autoscaling/v2
kind: VerticalPodAutoscaler
metadata:
  name: gateway-vpa
  namespace: jpmorgan
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: jpmorgan-gateway
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
    - containerName: gateway
      minAllowed:
        memory: 256Mi
        cpu: 100m
      maxAllowed:
        memory: 4Gi
        cpu: 2000m
      controlledResources: ["memory", "cpu"]

---
# VerticalPodAutoscaler for Model Runner
apiVersion: autoscaling/v2
kind: VerticalPodAutoscaler
metadata:
  name: model-runner-vpa
  namespace: jpmorgan
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: model-runner
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
    - containerName: ollama
      minAllowed:
        memory: 1Gi
        cpu: 500m
      maxAllowed:
        memory: 16Gi
        cpu: 8000m
      controlledResources: ["memory", "cpu"]

---
# ClusterAutoscaler configuration (via annotations)
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-autoscaler-config
  namespace: jpmorgan
data:
  cluster-autoscaler.yaml: |
    # This ConfigMap is used to configure the cluster autoscaler
    # Reference: https://github.com/kubernetes/autoscaler/tree/master/cluster-autoscaler
    
    # Scale-up utilization threshold
    scale-up-utilization-threshold: 0.8
    
    # Scale-down utilization threshold  
    scale-down-utilization-threshold: 0.5
    
    # Scale-down unneeded time
    scale-down-unneeded-time: 10m
    
    # Scale-down delay after scale-up
    scale-down-delay-after-add: 10m
    
    # Scale-down delay after failure
    scale-down-delay-after-failure: 3m
    
    # Max nodes
    max-nodes-total: 50
    
    # Min nodes
    min-nodes-total: 3
    
    # Core utilization threshold
    core-utilization-threshold: 0.85
