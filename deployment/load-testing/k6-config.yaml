# k6 Load Testing Configuration for JPMorgan Financial APIs
# Phase 8 - Post-Deployment Monitoring

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-config
  namespace: jpmorgan
data:
  api-test.js: |
    import http from 'k6/http';
    import { check, sleep, group } from 'k6';
    import { Rate, Trend } from 'k6/metrics';
    
    // Custom metrics
    const errorRate = new Rate('errors');
    const apiLatency = new Trend('api_latency');
    
    // Configuration
    const BASE_URL = __ENV.BASE_URL || 'https://api.jpmorgan-financial.com';
    const API_KEY = __ENV.API_KEY || 'test-api-key';
    
    // Test configuration
    export const options = {
      scenarios: {
        // Smoke test - baseline
        smoke: {
          executor: 'constant-vus',
          vus: 1,
          duration: '30s',
          tags: { test_type: 'smoke' },
        },
        // Load test - normal traffic
        load: {
          executor: 'ramping-vus',
          startVUs: 0,
          stages: [
            { duration: '2m', target: 100 },  // Ramp to 100 users
            { duration: '5m', target: 100 }, // Hold at 100
            { duration: '2m', target: 200 },  // Ramp to 200
            { duration: '5m', target: 200 }, // Hold at 200
            { duration: '2m', target: 0 },    // Ramp down
          ],
          tags: { test_type: 'load' },
        },
        // Stress test - peak traffic
        stress: {
          executor: 'ramping-vus',
          startVUs: 0,
          stages: [
            { duration: '1m', target: 500 },  // Ramp to 500
            { duration: '3m', target: 500 },  // Hold at 500
            { duration: '1m', target: 1000 }, // Ramp to 1000
            { duration: '3m', target: 1000 }, // Hold at 1000
            { duration: '1m', target: 0 },     // Ramp down
          ],
          tags: { test_type: 'stress' },
        },
        // Spike test - sudden traffic
        spike: {
          executor: 'ramping-vus',
          startVUs: 0,
          stages: [
            { duration: '30s', target: 1000 },
            { duration: '30s', target: 3000 }, // Sudden spike
            { duration: '30s', target: 1000 },
            { duration: '1m', target: 0 },
          ],
          tags: { test_type: 'spike' },
        },
        // Soak test - long duration
        soak: {
          executor: 'constant-vus',
          vus: 200,
          duration: '1h',
          tags: { test_type: 'soak' },
        },
      },
      thresholds: {
        // SLA thresholds
        http_req_duration: ['p(95)<500', 'p(99)<1000'],
        http_req_failed: ['rate<0.01'],
        http_reqs: ['count>1000'],
        api_latency: ['p(95)<500', 'p(99)<1000'],
        errors: ['rate<0.01'],
      },
    };
    
    // Headers
    const headers = {
      'Authorization': `Bearer ${API_KEY}`,
      'Content-Type': 'application/json',
      'X-Request-ID': '',
    };
    
    // Test scenarios
    export default function () {
      group('API Health', () => {
        const res = http.get(`${BASE_URL}/health`);
        check(res, {
          'health check status is 200': (r) => r.status === 200,
          'health check response time < 100ms': (r) => r.timings.duration < 100,
        }) || errorRate.add(1);
        sleep(1);
      });
    
      group('Account Endpoints', () => {
        // Get accounts
        const accountsRes = http.get(`${BASE_URL}/api/v1/accounts`, { headers });
        apiLatency.add(accountsRes.timings.duration);
        check(accountsRes, {
          'get accounts status is 200': (r) => r.status === 200,
          'get accounts response < 500ms': (r) => r.timings.duration < 500,
        }) || errorRate.add(1);
        sleep(0.5);
        
        // Get account details
        const accountRes = http.get(`${BASE_URL}/api/v1/accounts/ACC001`, { headers });
        apiLatency.add(accountRes.timings.duration);
        check(accountRes, {
          'get account status is 200': (r) => r.status === 200,
        }) || errorRate.add(1);
        sleep(0.5);
      });
    
      group('Transaction Endpoints', () => {
        // Get transactions
        const transRes = http.get(`${BASE_URL}/api/v1/transactions?limit=100`, { headers });
        apiLatency.add(transRes.timings.duration);
        check(transRes, {
          'get transactions status is 200': (r) => r.status === 200,
          'get transactions response < 500ms': (r) => r.timings.duration < 500,
        }) || errorRate.add(1);
        sleep(0.5);
        
        // Get transaction by ID
        const transIdRes = http.get(`${BASE_URL}/api/v1/transactions/TXN001`, { headers });
        apiLatency.add(transIdRes.timings.duration);
        check(transIdRes, {
          'get transaction status is 200': (r) => r.status === 200,
        }) || errorRate.add(1);
        sleep(0.5);
      });
    
      group('Payment Endpoints', () => {
        // Create payment
        const paymentPayload = JSON.stringify({
          from_account: 'ACC001',
          to_account: 'ACC002',
          amount: 100.00,
          currency: 'USD',
          description: 'k6 load test payment',
        });
        const paymentRes = http.post(`${BASE_URL}/api/v1/payments`, paymentPayload, { headers });
        apiLatency.add(paymentRes.timings.duration);
        check(paymentRes, {
          'create payment status is 201': (r) => r.status === 201,
          'create payment response < 1000ms': (r) => r.timings.duration < 1000,
        }) || errorRate.add(1);
        sleep(1);
      });
    
      group('Business Endpoints', () => {
        // Get revenue
        const revenueRes = http.get(`${BASE_URL}/api/v1/business/revenue`, { headers });
        apiLatency.add(revenueRes.timings.duration);
        check(revenueRes, {
          'get revenue status is 200': (r) => r.status === 200,
        }) || errorRate.add(1);
        sleep(0.5);
        
        // Get analytics
        const analyticsRes = http.get(`${BASE_URL}/api/v1/business/analytics`, { headers });
        apiLatency.add(analyticsRes.timings.duration);
        check(analyticsRes, {
          'get analytics status is 200': (r) => r.status === 200,
        }) || errorRate.add(1);
        sleep(0.5);
      });
    
      group('Auth Endpoints', () => {
        // Token refresh
        const tokenPayload = JSON.stringify({
          refresh_token: 'test-refresh-token',
        });
        const tokenRes = http.post(`${BASE_URL}/api/v1/auth/refresh`, tokenPayload, { headers });
        apiLatency.add(tokenRes.timings.duration);
        check(tokenRes, {
          'token refresh status is 200': (r) => r.status === 200,
        }) || errorRate.add(1);
        sleep(1);
      });
    }
    
    // Handle summary
    export function handleSummary(data) {
      return {
        'stdout': textSummary(data, { indent: ' ', enableColors: true }),
        'summary.json': JSON.stringify(data),
      };
    }
    
    function textSummary(data, opts) {
      let output = '\n=== Test Summary ===\n';
      
      // Extract key metrics
      const duration = data.metrics.http_req_duration;
      if (duration) {
        output += `\nResponse Time:\n`;
        output += `  p95: ${duration.values['p(95)'].toFixed(2)}ms\n`;
        output += `  p99: ${duration.values['p(99)'].toFixed(2)}ms\n`;
        output += `  avg: ${duration.values.avg.toFixed(2)}ms\n`;
      }
      
      const reqs = data.metrics.http_reqs;
      if (reqs) {
        output += `\nTotal Requests: ${reqs.values.count}\n`;
        output += `Request Rate: ${reqs.values.rate.toFixed(2)}/s\n`;
      }
      
      const failed = data.metrics.http_req_failed;
      if (failed) {
        output += `\nFailed Requests: ${failed.values.passes} (${(failed.values.rate * 100).toFixed(2)}%)\n`;
      }
      
      return output;
    }

---
# k6 Test Runner Job
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
  namespace: jpmorgan
spec:
  template:
    metadata:
      labels:
        app: k6
    spec:
      restartPolicy: Never
      containers:
      - name: k6
        image: grafana/k6:latest
        env:
        - name: BASE_URL
          valueFrom:
            configMapKeyRef:
              name: k6-env
              key: BASE_URL
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: k6-credentials
              key: api-key
        args:
        - run
        - /scripts/api-test.js
        - --outinfluxdb=http://influxdb:8086/k6
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        resources:
          requests:
            cpu: 1000m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
      volumes:
      - name: scripts
        configMap:
          name: k6-config

---
# k6 Test Results ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-baseline-metrics
  namespace: jpmorgan
data:
  baseline.json: |
    {
      "baselines": {
        "smoke": {
          "http_req_duration_p95": 50,
          "http_req_duration_p99": 100,
          "http_req_failed_rate": 0,
          "http_reqs_rate": 10
        },
        "load": {
          "http_req_duration_p95": 200,
          "http_req_duration_p99": 500,
          "http_req_failed_rate": 0.01,
          "http_reqs_rate": 50
        },
        "stress": {
          "http_req_duration_p95": 500,
          "http_req_duration_p99": 1000,
          "http_req_failed_rate": 0.02,
          "http_reqs_rate": 200
        },
        "spike": {
          "http_req_duration_p95": 800,
          "http_req_duration_p99": 1500,
          "http_req_failed_rate": 0.05,
          "http_reqs_rate": 500
        },
        "soak": {
          "http_req_duration_p95": 300,
          "http_req_duration_p99": 700,
          "http_req_failed_rate": 0.01,
          "http_reqs_rate": 100
        }
      },
      "sla_thresholds": {
        "http_req_duration_p95": 500,
        "http_req_duration_p99": 1000,
        "http_req_failed_rate": 0.01,
        "min_request_rate": 1000
      }
    }

---
# InfluxDB for k6 Results
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-influxdb-config
  namespace: jpmorgan
data:
  config.toml: |
    [http]
    bind_address = :8086
    auth_enabled = false
    
    [[httpd]]
    bind_address = :8086
    
    [data]
    engine = "tsm1"
    path = "/var/lib/influxdb/data"
    wal_path = "/var/lib/influxdb/wal"
    
    [[induct]]
    [collect]
    poll_interval = "10s"
    gather_timeout = "5s"

---
# InfluxDB Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  namespace: jpmorgan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      containers:
      - name: influxdb
        image: influxdb:2.7-alpine
        ports:
        - containerPort: 8086
          name: http
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/influxdb2
      volumes:
      - name: data
        emptyDir: {}

---
# InfluxDB Service
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: jpmorgan
spec:
  selector:
    app: influxdb
  ports:
  - name: http
    port: 8086
    targetPort: 8086
