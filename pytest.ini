[pytest]
addopts = --cov-fail-under=80 --cov-report=term-missing --cov=jpmorgan_financial_apis
pythonpath = .
testpaths = tests jpmorgan_financial_apis/tests
filterwarnings =
    ignore::pytest.PytestConfigWarning
    ignore::pytest.PytestCollectionWarning
    ignore::coverage.exceptions.CoverageWarning
markers =
    slow: marks tests as slow
    phase8: phase 8 integration tests
    coverage: marks high-coverage tests
minversion = 7.0
asyncio_mode = strict

