[pytest]
addopts = --cov-fail-under=78 --cov-report=term-missing --cov=src.audit_logger --cov=src.models.audit_log --cov=src.revenue_service --cov=app_final
pythonpath = .
testpaths = tests jpmorgan_financial_apis/tests
filterwarnings =
    ignore::pytest.PytestConfigWarning
    ignore::pytest.PytestCollectionWarning
    ignore::coverage.exceptions.CoverageWarning
markers =
    slow: marks tests as slow
    phase8: phase 8 integration tests
    coverage: marks high-coverage tests
minversion = 7.0
asyncio_mode = strict

